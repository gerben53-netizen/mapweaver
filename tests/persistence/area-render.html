<!doctype html>
<html lang="en">
  <title>Area rendering acceptance fixture</title>
  <body>
    <pre id="result">Running</pre>
    <script type="module">
      import { Group } from '/node_modules/konva/lib/Group.js'
      import { Rect } from '/node_modules/konva/lib/shapes/Rect.js'
      import { createPattern, patternPaintProps } from '/src/domain/patterns.ts'
      import {
        migratePattern,
        createArea,
        rectangleGeometry,
        normalizeGeometry,
      } from '/src/domain/areas.ts'
      import { paintArea } from '/src/canvas/drawArea.ts'
      const source = document.createElement('canvas')
      source.width = 16
      source.height = 12
      const c = source.getContext('2d')
      c.fillStyle = '#37aacc'
      c.fillRect(0, 0, 8, 12)
      c.fillStyle = '#b67544'
      c.fillRect(8, 0, 8, 6)
      const results = []
      for (const mode of ['repeat', 'stretch'])
        for (const rotation of [0, 37]) {
          const old = {
            ...createPattern('test', { x: 31, y: 44, width: 150, height: 100 }),
            mode,
            patternScale: 1.3,
            patternRotation: rotation,
            patternOffsetX: 7,
            patternOffsetY: -3,
            opacity: 0.6,
          }
          const root = new Group({
            clipX: 0,
            clipY: 0,
            clipWidth: 150,
            clipHeight: 100,
          })
          root.add(
            new Rect({
              ...patternPaintProps(old, source),
              fillPatternImage: source,
              perfectDrawEnabled: false,
            }),
          )
          const legacy = root.toCanvas({
              x: 0,
              y: 0,
              width: 150,
              height: 100,
              pixelRatio: 1,
            }),
            next = document.createElement('canvas')
          next.width = 150
          next.height = 100
          paintArea(next.getContext('2d'), migratePattern(old), source)
          const a = legacy.getContext('2d').getImageData(0, 0, 150, 100).data,
            b = next.getContext('2d').getImageData(0, 0, 150, 100).data
          let max = 0,
            changed = 0
          for (let i = 0; i < a.length; i++) {
            max = Math.max(max, Math.abs(a[i] - b[i]))
            if (a[i] !== b[i]) changed++
          }
          results.push({
            mode,
            rotation,
            maxChannelDifference: max,
            changedChannels: changed,
          })
          root.destroy()
        }
      const area = createArea(
        rectangleGeometry({ x: 0, y: 0, width: 100, height: 100 }),
      )
      area.geometry.polygons[0].holes = [
        rectangleGeometry({ x: 30, y: 30, width: 40, height: 40 }).polygons[0]
          .outer,
      ]
      area.geometry = normalizeGeometry(area.geometry)
      const canvas = document.createElement('canvas')
      canvas.width = 100
      canvas.height = 100
      paintArea(canvas.getContext('2d'), area)
      const holeAlpha = canvas.getContext('2d').getImageData(50, 50, 1, 1)
        .data[3]
      const shape = {
        polygons: [
          {
            outer: Array.from({ length: 512 }, (_, i) => ({
              x: 500 + 400 * Math.cos((i * Math.PI) / 256),
              y: 500 + 400 * Math.sin((i * Math.PI) / 256),
            })),
            holes: [],
          },
        ],
      }
      const start = performance.now()
      for (let i = 0; i < 100; i++) normalizeGeometry(shape)
      const validationMs = performance.now() - start
      window.areaRenderResult = { results, holeAlpha, validationMs }
      document.querySelector('#result').textContent = JSON.stringify(
        window.areaRenderResult,
        null,
        2,
      )
    </script>
  </body>
</html>
